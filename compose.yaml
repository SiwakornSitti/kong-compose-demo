services:
  kong-database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong
    volumes:
      - kong_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 5s
      timeout: 5s
      retries: 10

  kong-migrations:
    image: kong:3.9.3
    command: kong migrations bootstrap
    depends_on:
      kong-database:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong

  kong-configure:
    build:
      context: .
      dockerfile: Dockerfile.deck
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        last_checksum=""
        while true; do
          checksum="$$(cksum /config/kong.yml)"
          if [ "$$checksum" != "$$last_checksum" ]; then
            deck gateway sync /config/kong.yml || true
            last_checksum="$$checksum"
          fi
          sleep 1
        done
    depends_on:
      kong:
        condition: service_healthy
    environment:
      DECK_KONG_ADDR: http://kong:8001
    volumes:
      - ./kong.yml:/config/kong.yml:ro

  kong:
    image: kong:3.9.3
    restart: unless-stopped
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  konga:
    image: pantsel/konga:0.14.9
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      - kong
    environment:
      NO_AUTH: "true"
      KONGA_SEED_KONG_NODE_DATA_SOURCE_FILE: /run/config/konga-node-seed.js
    volumes:
      - ./konga-node-seed.js:/run/config/konga-node-seed.js:ro
    ports:
      - "127.0.0.1:1337:1337"

volumes:
  kong_data:
